name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: test (flagship - llm-log-triage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/llm-log-triage
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Smoke-test the end-to-end pipeline
        run: |
          python -m src.cli run --db /tmp/ci.db --logs data/sample_logs.jsonl
          python -m src.cli query --db /tmp/ci.db --sql sql/analysis/01_attack_overview.sql

  security-regression:
    name: security regression (red-team ranges)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each harness exits non-zero if ANY invariant breaks: an attack that should
      # exploit the vulnerable target stops working, a detector stops catching it, a
      # hardened control regresses, or the benign control starts false-positiving.
      - name: Assessment invariants (vulnerable app)
        run: python3 red-team/assessment/run_assessment.py
      - name: Agent-range invariants (multi-step tool-using agent)
        run: python3 red-team/agent-range/run_range.py
      - name: Web/API range invariants (conventional layer — SSRF/IDOR/auth/XSS/SQLi)
        run: python3 red-team/web-api-range/run_web_assessment.py

      # The harnesses rewrite their own evidence. If regenerating changes a committed
      # file, the evidence in the repo no longer matches the code that produced it.
      - name: Committed evidence is reproducible (no drift)
        run: |
          if ! git diff --quiet -- red-team/assessment red-team/agent-range red-team/web-api-range; then
            echo "::error::Committed red-team evidence is stale — re-run the harnesses and commit the regenerated EVIDENCE.md / results.json."
            git --no-pager diff --stat -- red-team/assessment red-team/agent-range red-team/web-api-range
            exit 1
          fi
          echo "Committed evidence reproduces byte-identically."

      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          a = json.loads(pathlib.Path("red-team/assessment/results.json").read_text())["attacks"]
          r = json.loads(pathlib.Path("red-team/agent-range/results.json").read_text())
          w = json.loads(pathlib.Path("red-team/web-api-range/results.json").read_text())
          atk = [x for x in a if x["success_criterion"] != "(detection-only / control)"]
          sc = [x for x in r if x["success_criterion"] != "(control)"]
          wk = [x for x in w if x["success_criterion"] != "(control)"]
          print("## Security regression\n")
          print(f"- **Assessment:** {sum(x['exploited_vulnerable'] for x in atk)}/{len(atk)} attack paths exploited · "
                f"{sum(x['detected_on_input'] or x['detected_on_output'] for x in atk)}/{len(atk)} detected · "
                f"{sum(x['blocked_hardened'] for x in atk)}/{len(atk)} mitigations verified")
          print(f"- **Agent range:** {sum(x['exploited'] for x in sc)}/{len(sc)} chains exploited · "
                f"{sum(x['detected'] for x in sc)}/{len(sc)} detected · "
                f"{sum(x['hardened_blocked'] for x in sc)}/{len(sc)} broken at a kill point")
          print(f"- **Web/API range:** {sum(x['exploited_vulnerable'] for x in wk)}/{len(wk)} web/API flaws exploited · "
                f"{sum(x['hardened_blocked'] for x in wk)}/{len(wk)} blocked after hardening (retest)")
          print("- **Benign controls:** clean · **evidence:** reproducible")
          PY
